# Publishes the site to GitHub Pages on every push to main.
#
# Paths listed in UNPUBLISHED stay in the repo but are left out of the live site.
# To release one, delete its line and push.
#
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UNPUBLISHED: |
    Lessons/1_foundations_of_genai
    Lessons/2_multimodal_+_advanced_models
    Assignments/2_multimodal_+_advanced_models

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site without unpublished paths
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '.DS_Store' ./ _site/
          while IFS= read -r p; do
            if [ -n "$p" ]; then rm -rf "_site/$p"; fi
          done <<< "$UNPUBLISHED"
          test ! -e "_site/Lessons/1_foundations_of_genai"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
